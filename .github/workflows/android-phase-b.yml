name: Review SlashPromo Android Phase B assets
on:
  pull_request:
    paths:
      - 'android/**'
      - 'assets/pwa-icon-*.png'
      - 'assets/pwa-maskable-*.png'
      - 'manifest.webmanifest'
      - 'scripts/test-android-phase-b.mjs'
      - '.github/workflows/android-phase-b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-android-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-android-phase-b.mjs
