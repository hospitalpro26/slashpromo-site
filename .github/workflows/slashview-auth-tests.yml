name: Slashview authentication tests
on:
  pull_request:
    paths:
      - 'slashview-backend/**'
      - '.github/workflows/slashview-auth-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test slashview-backend/tests/*.test.mjs
