name: Audit SlashPromo SEO and question routes
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - sitemap.xml
      - robots.txt
      - assets/site.js
      - scripts/test-whatsapp-handoff.mjs
      - contact/index.html
      - privacy/index.html
      - assets/city-questions.js
      - functions/_lib/qa.js
      - scripts/audit-site.mjs
      - scripts/audit-profile-quality.mjs
      - assets/directory.json
      - .github/workflows/audit-site.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check client and API JavaScript syntax
        run: |
          node --check assets/site.js
          node --check assets/city-questions.js
          node --check functions/_lib/qa.js
          node --check functions/api/questions.js
          node --check functions/api/qa-admin.js
          node --check scripts/indexnow.mjs
      - name: Check WhatsApp-first contact and public page coverage
        run: node scripts/test-whatsapp-handoff.mjs
      - name: Audit SEO, sitemap and page-specific Q&A
        run: node scripts/audit-site.mjs
      - name: Audit doctor and hospital data quality
        run: node scripts/audit-profile-quality.mjs
      - name: Check priority Google search snippets without publishing
        run: |
          node --check scripts/test-google-search-priorities.mjs
          node scripts/test-google-search-priorities.mjs
