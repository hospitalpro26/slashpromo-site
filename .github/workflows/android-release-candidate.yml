name: Android signed release (one approval)

on:
  push:
    branches: [main]
    paths: ['android/app/build.gradle']
  workflow_dispatch:
    inputs:
      publish_update:
        description: 'Publish verified APK as a public GitHub release for in-app updates (no private data)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: android-release
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Android configuration
        run: node scripts/test-android-native.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          TOOL="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$TOOL" ]; then TOOL="$SDK/cmdline-tools/16.0/bin/sdkmanager"; fi
          "$TOOL" "platforms;android-36" "build-tools;35.0.0"
      - name: Fetch and verify offline clinical ECG assets
        run: |
          node scripts/fetch-ecg-assets.mjs
          node scripts/test-ecg-pack.mjs
      - name: Build unsigned release
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign and verify candidate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${KEYSTORE_BASE64:?Missing owner keystore}" "${STORE_PASSWORD:?Missing store password}" "${KEY_PASSWORD:?Missing key password}"
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key"
          unset KEYSTORE_BASE64
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p candidate
          "$tools/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias slashpromo --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out candidate/slashpromo-release.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs candidate/slashpromo-release.apk > candidate/certificate.txt
          fingerprint="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' candidate/certificate.txt)"
          fingerprint="$(printf '%s' "$fingerprint" | sed 's/../&:/g;s/:$//')"
          node android/generate-assetlinks.mjs "$fingerprint" > candidate/assetlinks.json
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("candidate/assetlinks.json"));const b=JSON.parse(fs.readFileSync(".well-known/assetlinks.json"));if(JSON.stringify(a)!==JSON.stringify(b))throw Error("Signing certificate does not match approved website association")'
      - uses: actions/upload-artifact@v4
        with:
          name: slashpromo-release-candidate-review-only
          path: candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Publish signed APK only
        if: github.event_name == 'push' || inputs.publish_update == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version_code="$(sed -nE 's/^[[:space:]]*versionCode ([0-9]+)[[:space:]]*$/\1/p' android/app/build.gradle)"
          version_name="$(sed -nE "s/^[[:space:]]*versionName '([^']+)'[[:space:]]*$/\1/p" android/app/build.gradle)"
          [[ "$version_code" =~ ^[0-9]+$ ]]
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="android-$version_code"
          test -s candidate/slashpromo-release.apk
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite a signed version."
            exit 1
          fi
          gh release create "$tag" candidate/slashpromo-release.apk --target "$GITHUB_SHA" --title "Slashview $version_name" --notes "Signed Android update. Install over the existing production application. Private library files are not included." --latest
