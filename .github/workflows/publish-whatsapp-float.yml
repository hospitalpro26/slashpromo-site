name: Publish shared analytics and WhatsApp asset cache refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-whatsapp-float.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-public-html:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh shared JS and CSS version in all HTML pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          pattern = re.compile(r'((?:src|href)=")(/assets/(?:site\.js|theme\.css|city-questions\.js))(?:\?[^"]*)?(")')
          count = references = 0
          for page in Path(".").rglob("index.html"):
              if ".git" in page.parts:
                  continue
              old = page.read_text(encoding="utf-8")
              new, n = pattern.subn(lambda m: m.group(1) + m.group(2) + "?v=20261108-enquiries6" + m.group(3), old)
              if n and new != old:
                  page.write_text(new, encoding="utf-8")
                  count += 1
                  references += n
          print(f"Updated {count} HTML pages and {references} shared asset references.")
          assert count >= 75, "Expected a site-wide cache refresh."
          for target in ["index.html","sukkur/index.html","karachi/index.html","khairpur/index.html","shikarpur/index.html","contact/index.html"]:
              page = Path(target).read_text(encoding="utf-8")
              assert '/assets/site.js?v=20261108-enquiries6' in page, target
              assert '/assets/theme.css?v=20261108-enquiries6' in page, target
          js = Path("assets/site.js").read_text(encoding="utf-8")
          css = Path("assets/theme.css").read_text(encoding="utf-8")
          assert "sp-team-whatsapp-float" in js and "sp-team-whatsapp-float" in css
          assert "sp-wa-query-form" in js and "From page URL:" in js and "sp-wa-query-panel" in css
          assert "sp-wa-consent" in js and "/api/enquiries" in js
          assert "sp-wa-handoff" in css
          assert "window.slashpromoTrack" in js and "/api/analytics" in js
          assert "qa_submitted" in Path("assets/city-questions.js").read_text(encoding="utf-8")
          assert "data.reference" in Path("assets/city-questions.js").read_text(encoding="utf-8")
          assert "923352648572" in js
          PY
          node --check assets/site.js
      - name: Prepare WhatsApp asset cache refresh for owner review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo 'All asset versions already current.'
            exit 0
          fi
          git commit -m "Refresh floating WhatsApp button assets on all public pages"
          branch="automation/publish-whatsapp-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git push -u origin "$branch"
          compare_url="https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          if gh pr create --base main --head "$branch" --draft \
            --title "Review WhatsApp and analytics asset refresh before publication" \
            --body "Refresh existing WhatsApp and analytics asset cache versions across public pages. Owner review and explicit approval are required before any merge. This workflow never publishes automatically."; then
            echo "Created draft PR for review; no changes published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Automated draft PR creation unavailable; review branch preserved: $compare_url"
            echo "Open a manual draft PR to review changes: $compare_url" >> "$GITHUB_STEP_SUMMARY"
          fi
