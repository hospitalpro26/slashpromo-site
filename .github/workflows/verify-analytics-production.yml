name: Verify live SlashPromo analytics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-analytics-production.yml'
      - 'functions/api/analytics.js'
      - 'functions/api/analytics-report.js'
      - 'functions/_lib/analytics.js'
      - 'analytics/index.html'
      - 'control-center/index.html'
      - 'functions/api/control-center.js'
      - 'scripts/test-visitor-geography.mjs'
      - 'assets/site.js'
      - 'assets/directory.json'
      - 'scripts/test-slashcure-referrals.mjs'
      - 'assets/city-questions.js'
      - '_routes.json'
      - 'sukkur/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and privacy invariants
        run: |
          set -euo pipefail
          node --check assets/site.js
          node --check functions/_lib/analytics.js
          node --check functions/api/analytics.js
          node --check functions/api/analytics-report.js
          node --check functions/api/control-center.js
          node scripts/test-visitor-geography.mjs
          node scripts/test-analytics-dashboard.mjs
          node scripts/test-slashcure-referrals.mjs
          grep -q 'Visitor geography' control-center/index.html
          grep -q 'Visitor geography' analytics/index.html
          node --check assets/city-questions.js
          grep -q 'window.slashpromoTrack' assets/site.js
          grep -q 'sp-wa-query-form' assets/site.js
          grep -q 'window.slashpromoTrack' assets/city-questions.js
          grep -q 'analytics-report' _routes.json
          grep -q 'noindex,nofollow' analytics/index.html
      - name: Confirm the live dashboard and locked report endpoint
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            dashboard=$(curl -sSL --max-time 18 -o /tmp/analytics.html -w '%{http_code}' "https://slashpromo.com/analytics/?verify=$GITHUB_SHA" || true)
            source=$(curl -sSL --max-time 18 -o /tmp/site-js.html -w '%{http_code}' 'https://slashpromo.com/assets/site.js?v=20261108-analytics4' || true)
            auth=$(curl -sSL --max-time 18 -o /tmp/report.json -w '%{http_code}' 'https://slashpromo.com/api/analytics-report?days=7' || true)
            method=$(curl -sSL --max-time 18 -o /tmp/method.json -w '%{http_code}' 'https://slashpromo.com/api/analytics' || true)
            health=$(curl -sSL --max-time 18 -o /tmp/health.json -w '%{http_code}' 'https://slashpromo.com/api/analytics?health=1' || true)
            if [ "$dashboard" = 200 ] && [ "$source" = 200 ] && [ "$auth" = 401 ] && [ "$method" = 405 ] && [ "$health" = 200 ] && \
               grep -q 'Private Analytics Dashboard' /tmp/analytics.html && \
               grep -q 'Traffic by Slashpromo page city' /tmp/analytics.html && \
               grep -q 'Page interest vs visitor origin' /tmp/analytics.html && \
               grep -q 'window.slashpromoTrack' /tmp/site-js.html && \
               grep -q 'Unauthorized' /tmp/report.json && grep -q '"enabled":true' /tmp/health.json; then
              echo 'PASS: dashboard loads; tracker deployed; D1 DB connected; unauthorized reporting rejected; GET ingestion blocked.'
              echo "Live dashboard: https://slashpromo.com/analytics/"
              exit 0
            fi
            echo "Attempt $attempt: dashboard=$dashboard JS=$source report-without-key=$auth GET-collector=$method DB-health=$health"
            sleep 12
          done
          echo 'Live analytics smoke test did not pass. Inspect production routing / Cloudflare D1 configuration.' >&2
          exit 1
