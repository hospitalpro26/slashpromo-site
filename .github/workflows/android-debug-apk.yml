name: Android TWA debug APK (review only)

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Android project configuration
        run: node scripts/test-android-native.mjs
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools"
          command -v sdkmanager || true
      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          TOOL="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$TOOL" ]; then TOOL="$SDK/cmdline-tools/16.0/bin/sdkmanager"; fi
          "$TOOL" "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fetch and verify offline clinical ECG assets
        run: |
          node scripts/fetch-ecg-assets.mjs
          node scripts/test-ecg-pack.mjs
      - name: Build isolated debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug test APK (not a Play release)
        uses: actions/upload-artifact@v4
        with:
          name: slashpromo-android-debug-test-only
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
