<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slashview Admin</title><style>body{font:16px system-ui;max-width:950px;margin:30px auto;padding:16px;color:#183654}h1{color:#0038c8}button,input{font:inherit;padding:9px;margin:5px}article{border:1px solid #ccd5e0;border-radius:12px;padding:14px;margin:10px 0}label{display:block}button{cursor:pointer}#status{white-space:pre-wrap}</style><h1>Slash<span style="color:#ed001c">view</span> Admin Centre</h1><p>Local review client. Serve from the same protected Worker origin after deployment. No credentials are persisted.</p><label>Administrator token <input id="token" type="password" autocomplete="off"></label><button id="load">Load accounts</button><button id="lock">Lock dashboard</button><p id="status" role="status"></p><section id="accounts"></section><script>
const token=document.querySelector('#token'), status=document.querySelector('#status'), accounts=document.querySelector('#accounts');
async function api(path,body){if(location.protocol!=='https:')throw Error('HTTPS required');const t=token.value;if(t.length<32)throw Error('Administrator token required');const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store',redirect:'error'});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data;}
async function load(){accounts.replaceChildren();try{const data=await api('/v1/admin/accounts');status.textContent='Showing '+data.accounts.length+' recent accounts';for(const a of data.accounts){const card=document.createElement('article');const line=document.createElement('p');line.textContent=a.name+' | '+a.email+' | '+a.status+' | '+(a.email_verified_at?'Verified':'Unverified')+' | Trial ends: '+(a.trial_until||'Not started');card.append(line);const profile=document.createElement('p');profile.textContent='City: '+(a.city||'Not provided')+' | Address: '+(a.address||'Not provided')+' | WhatsApp: '+(a.whatsapp||'Not provided');card.append(profile);if(a.status==='pending'&&a.email_verified_at){const b=document.createElement('button');b.textContent='Approve and start trial';b.onclick=async()=>{if(!confirm('Approve this account and begin its trial?'))return;b.disabled=true;try{await api('/v1/admin/approve',{id:a.id});await load()}catch(e){status.textContent=e.message;b.disabled=false}};card.append(b)}if(a.status==='approved'&&a.email_verified_at){const b=document.createElement('button');b.textContent='Record $1 payment';b.onclick=async()=>{const reference=prompt('Enter the unique reference of an independently verified $1 payment.');if(!reference||!confirm('Confirm payment received and extend membership by one month?'))return;b.disabled=true;try{await api('/v1/admin/renew',{id:a.id,reference});await load()}catch(e){status.textContent=e.message;b.disabled=false}};card.append(b)}if(['pending','approved'].includes(a.status)){const b=document.createElement('button');b.textContent=a.status==='pending'?'Reject':'Suspend';b.onclick=async()=>{if(!confirm('Revoke account access? Local study files will not be deleted.'))return;b.disabled=true;try{await api('/v1/admin/status',{id:a.id,status:a.status==='pending'?'rejected':'suspended'});await load()}catch(e){status.textContent=e.message;b.disabled=false}};card.append(b)}accounts.append(card)}}catch(e){status.textContent=e.message}}
document.querySelector('#load').onclick=load;document.querySelector('#lock').onclick=()=>{token.value='';accounts.replaceChildren();status.textContent='Locked'};
</script></html>
