name = "slashview-api"
main = "worker.js"
compatibility_date = "2026-11-25"
[[d1_databases]]
binding = "DB"
database_name = "slashview-auth"
database_id = "REPLACE_WITH_DEDICATED_DATABASE_ID"

[vars]
AUTH_ENABLED = "false"
REGISTRATION_ENABLED = "false"
REVIEW_ADMIN_ENABLED = "false"
# MAILER service binding must be provisioned separately before testing delivery.

GOOGLE_ENABLED = "false"
GOOGLE_CLIENT_ID = ""

ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
ACCESS_OWNER_EMAIL = ""
# ADMIN_TOKEN must be provisioned as a Worker secret, not a variable.
