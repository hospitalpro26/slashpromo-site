plugins {
    id 'com.android.application'
}

android {
    namespace 'com.slashpromo.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.slashpromo.app'
        minSdk 24
        targetSdk 35
        versionCode 28
        versionName '0.10.4'
    }

    // Stable signing is opt-in and must use a securely provisioned keystore.
    def stableKey = System.getenv('SLASHPROMO_KEYSTORE_PATH')
    def stablePassword = System.getenv('SLASHPROMO_KEYSTORE_PASSWORD')
    def stableAlias = System.getenv('SLASHPROMO_KEY_ALIAS')
    def stableKeyPassword = System.getenv('SLASHPROMO_KEY_PASSWORD')
    def signingValues = [stableKey, stablePassword, stableAlias, stableKeyPassword]
    def stableSigning = signingValues.every { it != null && !it.isEmpty() }
    if (signingValues.any { it != null && !it.isEmpty() } && !stableSigning) {
        throw new GradleException('Incomplete stable Android signing configuration')
    }
    signingConfigs {
        if (stableSigning) {
            stable {
                storeFile file(stableKey)
                storePassword stablePassword
                keyAlias stableAlias
                keyPassword stableKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (stableSigning) signingConfig signingConfigs.stable
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            resValue 'string', 'app_name', 'Slashview Test'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
