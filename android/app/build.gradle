plugins {
    id 'com.android.application'
}

android {
    namespace 'com.slashpromo.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.slashpromo.app'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '0.3.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            resValue 'string', 'app_name', 'SlashPromo Library Test'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
