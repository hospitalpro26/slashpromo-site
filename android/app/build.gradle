plugins {
    id 'com.android.application'
}

android {
    namespace 'com.slashpromo.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.slashpromo.app'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
